<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#edf2fa;--ink:#0a1020;--mut:#52607a;--card:#fff;--line:#d3ddee;--amber:#2f7df6;--green:#1f8a63;--red:#c4452b;--side:#060a14;--onside:#e6eefc;--blue:#0b3d91;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a14;--ink:#e6eefc;--mut:#8fa2c4;--card:#0e1626;--line:#22314d;--amber:#5db0ff;--green:#3ec595;--red:#ef7459;--side:#02040a;--blue:#3b7be0}}
:root[data-theme="dark"]{--bg:#060a14;--ink:#e6eefc;--mut:#8fa2c4;--card:#0e1626;--line:#22314d;--amber:#5db0ff;--green:#3ec595;--red:#ef7459;--side:#02040a;--blue:#3b7be0}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800}h2{font-size:1.1rem;font-weight:600;margin-bottom:10px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--onside);padding:20px 12px;position:sticky;top:0;height:100vh}
.logo{font:800 1.15rem "Bricolage Grotesque",sans-serif;padding:0 10px 4px}.site{padding:0 10px 22px;font-size:12px;opacity:.7}
aside a{display:block;color:inherit;text-decoration:none;padding:10px;border-radius:5px;margin-bottom:2px;font-weight:500}
aside a.on{background:var(--amber);color:var(--side)}aside a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top .sub{color:var(--mut)}.who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
button{font:500 14px "IBM Plex Sans",sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:8px 13px;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px;min-width:0}
.kpi b{display:block;font:800 1.7rem "Bricolage Grotesque",sans-serif;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.grid2>.card{margin-bottom:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sel td{background:color-mix(in srgb,var(--amber) 14%,transparent)}tr.cl{cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;border:1px solid}
.t-a{color:var(--green);border-color:var(--green)}.t-v{color:var(--red);border-color:var(--red)}.t-n{color:var(--mut);border-color:var(--line)}
svg{width:100%;height:auto;display:block}.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}
.leg b{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.m{color:var(--mut)}
.match{border-bottom:1px solid var(--line);padding:10px 0}.match:last-child{border:0}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:5px;max-width:340px;z-index:9}
.sc{display:flex;gap:6px;align-items:center}input[type=range]{accent-color:var(--amber)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px}.logo,.site{display:none}aside a{white-space:nowrap;margin:0}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}main{padding:18px 14px 60px}}
</style></head><body>
<div class="app"><aside><div class="logo">GridMatch</div><div class="site">Bedrijventerrein Gieten · netaansluiting 2.800 kW</div>
<a href="#gridmatch">GridMatch</a><a href="#gridmarket">GridMarket</a><a href="#credits">Credits</a><a href="#spaarpot">Spaarpot</a></aside>
<main id="v"></main></div><div id="toast" class="toast" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s),eur=n=>'€'+Math.round(n).toLocaleString('nl-NL'),nf=n=>Math.round(n).toLocaleString('nl-NL');
const prof={off:h=>h>=8&&h<=17?.8:.12,day:h=>h>=7&&h<=17?.9:.15,shift:h=>h>=6&&h<=22?.85:.45,print:h=>h>=6&&h<=20?.8:.2,long:h=>h>=5&&h<=21?.75:.3,retail:h=>h>=9&&h<=18?.8:.12,web:h=>h>=9&&h<=21?.55:.1,trans:h=>h>=18||h<=5?.8:.3,fire:h=>h>=19&&h<=22?.7:.35};
const C=[
{id:0,n:'Focus Oogheelkunde voor dieren',s:'Veterinaire oogheelkunde',k:50,p:'off',cr:900,need:0},
{id:1,n:'ZPN Gieten',s:'Zonnepanelen & installatie',k:60,p:'off',cr:1500,need:30},
{id:2,n:'Kunststofbouw Gieten',s:'Kozijnen & gevelbekleding',k:180,p:'day',cr:700,need:60},
{id:3,n:'Lucht & Warmte Techniek',s:'Klimaatinstallaties',k:45,p:'day',cr:800,need:0},
{id:4,n:'Eco Keukens',s:'Houten keukens op maat',k:70,p:'day',cr:650,need:0},
{id:5,n:'Havema Gieten',s:'Groothandel techniek',k:90,p:'day',cr:600,need:0},
{id:6,n:'Drukkerij Zwinderman',s:'Drukwerk & sign',k:160,p:'print',cr:500,need:50},
{id:7,n:'Beauty-knallers',s:'Webshop beauty',k:60,p:'web',cr:1300,need:0},
{id:8,n:'WKO Nederland',s:'Bodemenergiesystemen',k:60,p:'off',cr:1700,need:0},
{id:9,n:'Boter Stand-/Decorbouw',s:'Standbouw & interieur',k:150,p:'day',cr:550,need:0},
{id:10,n:'TOS Gieten',s:'Transport & onderhoud',k:120,p:'trans',cr:2400,need:0},
{id:11,n:'TendenZ Wonen',s:'Woonwinkel & meubels',k:70,p:'retail',cr:600,need:0},
{id:12,n:'Shell Okken',s:'Tankstation, wasstraat, bakkerij',k:130,p:'long',cr:800,need:50},
{id:13,n:'R. Haaijer',s:'Groothandel bouwmachines',k:50,p:'day',cr:450,need:0},
{id:14,n:'Autobedrijf Okken / Bosch Car Service',s:'Autodealer & werkplaats',k:110,p:'day',cr:650,need:40},
{id:15,n:'Brandweer Post Gieten',s:'Brandweerkazerne',k:70,p:'fire',cr:1900,need:0},
{id:16,n:'Schildersbedrijf Wiegman',s:'Schilder- & glaswerk',k:45,p:'day',cr:500,need:0},
{id:17,n:'Autobedrijf Westerman',s:'Autowerkplaats & tankstation',k:110,p:'day',cr:620,need:40},
{id:18,n:'Care For Buildings Group',s:'Holding & beheer',k:40,p:'off',cr:2100,need:0},
{id:19,n:'Transport Lokken-Vosdingh',s:'Transport & koeriers',k:160,p:'trans',cr:3120,need:0},
{id:20,n:'Abemec Gieten',s:'Landbouwmachines',k:100,p:'day',cr:700,need:0},
{id:21,n:'SelectiefWerkt',s:'Uitzendbureau',k:30,p:'off',cr:1100,need:0},
{id:22,n:'H.O.B. Plaagdierexperts',s:'Ongediertebestrijding',k:20,p:'off',cr:480,need:0},
{id:23,n:'Nedaplast',s:'Kunststofverwerking',k:450,p:'shift',cr:1400,need:0},
{id:24,n:'GoedkopeKozijnen.nl',s:'Kozijnenleverancier',k:60,p:'day',cr:420,need:0},
{id:25,n:'JoBo Gieten',s:'Zand, grind & bestrating',k:140,p:'day',cr:560,need:0}];
const TOTAL=2800,SAFE=1.08;
let S={now:new Date().getHours(),me:2,sel:2,fee:.04,pot:20000,
 orders:[{id:1,c:19,kW:90,a:9,b:13,pr:.115,end:Date.now()+300000,bids:[{c:6,pr:.118},{c:12,pr:.121}]},{id:2,c:10,kW:60,a:10,b:16,pr:.105,end:Date.now()+480000,bids:[{c:14,pr:.107}]},{id:3,c:15,kW:40,a:9,b:17,pr:.12,end:Date.now()+180000,bids:[]},{id:4,c:18,kW:25,a:10,b:16,pr:.1,end:Date.now()+660000,bids:[{c:17,pr:.104}]}],
 trades:[{t:'09:12',s:19,b:2,kW:50,h:4,pr:.11,fee:.88},{t:'08:40',s:10,b:12,kW:40,h:6,pr:.1,fee:.96}],
 hist:[210,260,180,310,240,330,280,250,340,300,270,360,320,290],
 inv:[{n:'Batterij 250 kWh',k:60000,st:'plan',d:'Piekschaving en opslag'},{n:'Elektrolyser 50 kW',k:90000,st:'plan',d:'Overschot omzetten naar waterstof'},{n:'Batterij Noord 100 kWh',k:28000,st:'live',d:'In bedrijf sinds maart'}],
 votes:{19:1,10:1,18:1,15:1,23:0,2:0},oid:5};
const ld=(c,h)=>Math.min(c.k,c.k*prof[c.p](h)*(1+.06*Math.sin(h*12.9+c.id*3.1)));
const fc=(c,h)=>c.k*prof[c.p](h);
const spare4=(c,h0)=>{let m=0;for(let i=0;i<4;i++)m=Math.max(m,fc(c,(h0+i)%24)*SAFE);return Math.max(0,c.k-m)};
const role=c=>{const s=spare4(c,S.now);if(c.need&&s<c.need)return['Vrager','t-v'];if(s>=40)return['Aanbieder','t-a'];return['Neutraal','t-n']};
const pr=n=>'€'+n.toFixed(3).replace('.',','),hb=o=>o.bids.reduce((a,b)=>!a||b.pr>a.pr?b:a,null),nm=i=>C[i].n,hh=h=>String(h%24).padStart(2,'0')+':00';
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
function trade(s,b,kW,h,pr){const v=kW*h*pr,fee=v*S.fee;S.pot+=fee;C[s].cr+=kW*h;S.hist[S.hist.length-1]+=fee;
 S.trades.unshift({t:hh(S.now).replace(':00',':'+String(new Date().getMinutes()).padStart(2,'0')),s,b,kW,h,pr,fee});
 toast(`${nm(b)} koopt ${kW} kW van ${nm(s)} (${eur(v)}). ${eur(fee)} naar de spaarpot, ${nf(kW*h)} credits voor de aanbieder.`)}
function matches(){const sup=C.map(c=>({c,l:spare4(c,S.now)})).filter(x=>x.l>=40&&!x.c.need).sort((a,b)=>b.l-a.l),out=[];
 C.filter(c=>c.need).forEach(d=>{let n=d.need;const own=spare4(d,S.now);n=Math.max(0,n-own);sup.forEach(x=>{if(n<=0||x.l<=0)return;const q=Math.min(n,Math.floor(x.l/10)*10);if(q<10)return;
 const sc=1+Math.max(0,(d.need/ (x.l+1)))*.1;out.push({s:x.c.id,b:d.id,kW:q,pr:+(.1*sc).toFixed(3),conf:Math.round(97-Math.abs(Math.sin(x.c.id+d.id))*6)});x.l-=q;n-=q})});return out}
function chart(c,w){const W=720,H=230,pl=34,pb=22,mx=c.k*1.15,sc=(H-pb-10)/mx,bw=(W-pl)/24;let s='';
 for(let h=0;h<24;h++){const x=pl+h*bw,a=ld(c,h),y=H-pb-a*sc,f=fc(c,h);
  s+=`<rect x="${x+2}" y="${y}" width="${bw-4}" height="${a*sc}" fill="${h==S.now?'var(--amber)':'var(--blue)'}" opacity="${h>S.now?.35:1}"/>`;
  s+=`<rect x="${x+2}" y="${H-pb-f*SAFE*sc}" width="${bw-4}" height="2" fill="var(--ink)"/>`;
  if(h%3==0)s+=`<text x="${x}" y="${H-6}" font-size="11" fill="var(--mut)">${hh(h)}</text>`}
 const yc=H-pb-c.k*sc;s+=`<line x1="${pl}" x2="${W}" y1="${yc}" y2="${yc}" stroke="var(--red)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-2}" y="${yc-5}" text-anchor="end" font-size="11" fill="var(--red)">Contract ${c.k} kW</text>`;
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verbruik en prognose ${c.n}">${s}</svg>`}
function capChart(){const wk=S.rng=='w',n=wk?7:24,W=700,H=260,l=46,r=10,t=10,b=24,CT=C.reduce((a,c)=>a+c.k,0),dn=['ma','di','wo','do','vr','za','zo'],f=[1,1.02,.98,1,.95,.45,.3],
 avg=C.reduce((a,c)=>a+Array.from({length:24},(_,h)=>ld(c,h)).reduce((x,y)=>x+y,0)/24,0),
 use=Array.from({length:n},(_,i)=>wk?avg*f[i]:C.reduce((a,c)=>a+ld(c,i),0)),
 fcs=Array.from({length:n},(_,i)=>wk?avg*f[i]*.97:C.reduce((a,c)=>a+fc(c,i),0)),
 hi=TOTAL*1.1,X=i=>l+(W-l-r)*i/n,Y=v=>t+(H-t-b)*(hi-v)/hi,
 pth=a=>a.map((v,i)=>(i?'L':'M')+X(i+.5).toFixed(1)+' '+Y(v).toFixed(1)).join(''),gap=use.map(u=>CT-u);let s='';
 for(let i=0;i<n;i++)if(gap[i]>.45*CT)s+=`<rect x="${X(i)}" y="${t}" width="${X(1)-X(0)}" height="${H-t-b}" fill="var(--amber)" opacity=".15"/>`;
 (wk?dn.map((d,i)=>[i+.5,d]):[0,6,12,18,24].map(h=>[h,h+':00'])).forEach(([p,tx])=>s+=`<text x="${X(p)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mut)">${tx}</text>`);
 for(let v=0;v<=hi;v+=500)s+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${nf(v)}</text>`;
 const rev=use.map((_,i)=>'L'+X(n-i-.5).toFixed(1)+' '+Y(CT).toFixed(1)).join('');
 s+=`<path d="${pth(use)}${rev}Z" fill="var(--blue)" opacity=".16"/><path d="${pth(use)}L${X(n-.5)} ${Y(0)}L${X(.5)} ${Y(0)}Z" fill="var(--green)" opacity=".25"/>`;
 s+=`<path d="${pth(fcs)}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="5 3"/><path d="${pth(use)}" fill="none" stroke="var(--green)" stroke-width="3"/>`;
 s+=`<line x1="${l}" x2="${W-r}" y1="${Y(CT)}" y2="${Y(CT)}" stroke="var(--amber)" stroke-width="2"/><line x1="${l}" x2="${W-r}" y1="${Y(TOTAL)}" y2="${Y(TOTAL)}" stroke="var(--red)" stroke-dasharray="6 4" stroke-width="2"/>`;
 if(!wk)s+=`<line x1="${X(S.now+.5)}" x2="${X(S.now+.5)}" y1="${t}" y2="${H-b}" stroke="var(--mut)" stroke-dasharray="2 3"/><circle cx="${X(S.now+.5)}" cy="${Y(use[S.now])}" r="5" fill="var(--green)" stroke="var(--card)" stroke-width="2"/>`;
 const im=gap.indexOf(Math.max(...gap)),lb=i=>wk?dn[i]:hh(i),pct=Math.round(use.reduce((a,b)=>a+b,0)/n/CT*100),big=gap.filter(g=>g>.45*CT).length;
 return`<div class="card" style="border-radius:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)">Verloop ${wk?'over een week (gemiddelde werkdag per dag)':'over 24 uur (vandaag)'}</h2><span class="row"><button class="${wk?'sec':''}" data-r="d">Vandaag</button><button class="${wk?'':'sec'}" data-r="w">Week</button></span></div>
 <div class="tw"><svg viewBox="0 0 ${W} ${H}" style="min-width:520px" role="img" aria-label="Totaal verbruik, prognose, gecontracteerde capaciteit en netaansluiting">${s}</svg></div>
 <div class="leg" style="gap:16px"><span><b style="background:var(--green);border-radius:50%"></b>Verbruik terrein</span><span><b style="background:var(--blue);border-radius:50%"></b>AI-prognose</span><span><b style="background:var(--amber);border-radius:50%"></b>Gecontracteerd</span><span><b style="background:var(--red);border-radius:50%"></b>Netaansluiting</span><span><b style="background:var(--blue);opacity:.3;border-radius:50%"></b>Ongebruikt (gat)</span><span><b style="background:var(--amber);opacity:.4;border-radius:50%"></b>Gat groter dan 45%</span></div>
 <div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg)">Gemiddeld ${pct}% van het gecontracteerde vermogen in gebruik. Grootste gat: <b>${lb(im)}</b> met <b>${nf(gap[im])} kW</b> ongebruikt. ${big} van ${n} ${wk?'dagen':'uren'} met een gat boven de 45%.</div></div>`}
function head(t,sub,extra=''){return`<div class="top"><div><h1>${t}</h1><div class="sub">${sub}</div></div><div class="who"><label for="me">Ingelogd als</label><select id="me">${C.map(c=>`<option value="${c.id}" ${c.id==S.me?'selected':''}>${c.n}</option>`).join('')}</select>${extra}</div></div>`}
function bindMe(){$('#me').onchange=e=>{S.me=+e.target.value;route()}}
const P={
gridmatch(){const live=C.reduce((a,c)=>a+ld(c,S.now),0),free=C.reduce((a,c)=>a+spare4(c,S.now),0),m=matches(),c=C[S.sel],need=C.reduce((a,c)=>a+c.need,0);
 return head('GridMatch','AI-prognose van verbruik en vrije capaciteit per bedrijf',`<span class="sc"><label for="tm">Tijd ${hh(S.now)}</label><input id="tm" type="range" min="0" max="23" value="${S.now}"></span>`)+
 `<div class="kpis"><div class="card kpi"><b>${nf(live)} kW</b><span>Verbruik nu van ${nf(TOTAL)} kW aansluiting</span></div>
 <div class="card kpi"><b>${nf(C.reduce((a,x)=>a+x.k,0))} kW</b><span>Gecontracteerd door ${C.length} bedrijven</span></div>
 <div class="card kpi"><b>${nf(free)} kW</b><span>Vrij te matchen komende 4 uur</span></div>
 <div class="card kpi"><b>${nf(need)} kW</b><span>Openstaande vraag</span></div></div>
 ${capChart()}<div class="card"><h2>Capaciteit per bedrijf</h2><div class="tw"><table><thead><tr><th>Bedrijf</th><th class="n">Contract</th><th class="n">Nu</th><th>Benutting</th><th class="n">Vrij (4u)</th><th class="n">Vraag</th><th>Rol</th></tr></thead><tbody>
 ${C.map(x=>{const l=ld(x,S.now),r=role(x);return`<tr class="cl ${x.id==S.sel?'sel':''}" data-i="${x.id}"><td>${x.n}<div class="m" style="font-size:12px">${x.s}</div></td><td class="n">${x.k} kW</td><td class="n">${nf(l)} kW</td><td><div class="bar"><i style="width:${l/x.k*100}%"></i></div></td><td class="n">${nf(spare4(x,S.now))} kW</td><td class="n">${x.need?x.need+' kW':'–'}</td><td><span class="tag ${r[1]}">${r[0]}</span></td></tr>`}).join('')}</tbody></table></div></div>
 <div class="grid2"><div class="card"><h2>${c.n}: verbruik en prognose</h2>${chart(c)}<div class="leg"><span><b style="background:var(--blue)"></b>Gemeten</span><span><b style="background:var(--amber)"></b>Nu</span><span><b style="background:var(--ink);height:3px"></b>Prognose + 8% marge</span><span class="m">Lichte balken: nog niet gemeten, prognose geldt</span></div></div>
 <div class="card"><h2>AI-matchvoorstellen</h2>${m.length?m.map((x,i)=>`<div class="match"><b>${nm(x.s)}</b> → <b>${nm(x.b)}</b><div class="m">${x.kW} kW · ${hh(S.now)}–${hh(S.now+4)} · ${pr(x.pr)}/kWh · zekerheid ${x.conf}%</div><div class="row" style="margin-top:6px"><button data-ex="${i}">Direct uitvoeren</button><button class="sec" data-pl="${i}">Op markt zetten</button></div></div>`).join(''):'<p class="m">Geen matches mogelijk voor dit tijdvak.</p>'}</div></div>`},
gridmarket(){const my=C[S.me],bids=S.orders;
 return head('GridMarket','Veiling van vrije kW binnen het terrein: het hoogste bod wint')+
 `<div class="card"><h2>Lopende veilingen</h2><div class="tw"><table><thead><tr><th>Aanbieder</th><th class="n">kW</th><th>Tijdvenster</th><th class="n">Startprijs</th><th class="n">Hoogste bod</th><th>Sluit over</th><th>Bieden (€/kWh)</th></tr></thead><tbody>
 ${bids.length?bids.map(o=>{const own=o.c==S.me,top=hb(o),mine=top&&top.c==S.me,min=top?top.pr+.001:o.pr;return`<tr><td>${nm(o.c)}</td><td class="n">${o.kW}</td><td>${hh(o.a)}–${hh(o.b)}</td><td class="n">${pr(o.pr)}</td><td class="n">${top?`<b>${pr(top.pr)}</b><div class="m" style="font-size:12px">${mine?'jouw bod':nm(top.c)}</div>`:'<span class="m">geen bod</span>'}</td><td class="n"><span class="cd" data-end="${o.end}"></span></td><td>${own?(top?`<button data-cl="${o.id}">Nu afsluiten</button>`:`<button class="sec" data-rm="${o.id}">Intrekken</button>`):`<span class="row"><input type="number" id="q${o.id}" min="${min.toFixed(3)}" step="0.001" value="${(min+(top?.004:0)).toFixed(3)}" style="width:92px" aria-label="Bod in euro per kWh"><button data-bid="${o.id}">Bied</button></span>`}</td></tr>`}).join(''):'<tr><td colspan="7" class="m">Geen lopende veilingen.</td></tr>'}</tbody></table></div></div>
 <div class="grid2"><div class="card"><h2>Veiling starten als ${my.n}</h2><div class="row"><label>kW <input id="fk" type="number" value="50" min="10" step="10" style="width:80px"></label><label>Van <input id="fa" type="number" value="${S.now}" min="0" max="23" style="width:64px"></label><label>tot <input id="fb" type="number" value="${(S.now+4)%24||24}" min="1" max="24" style="width:64px"></label><label>Startprijs €/kWh <input id="fp" type="number" value="0.10" step="0.005" style="width:90px"></label><label>Looptijd <select id="fd"><option value="1">1 min</option><option value="5" selected>5 min</option><option value="15">15 min</option></select></label><button id="po">Starten</button></div>
 <p class="m">Vrij bij ${my.n}: ${nf(spare4(my,S.now))} kW. Na afloop wint het hoogste bod. Transactiekosten: ${S.fee*100}% naar de corporatie.</p></div>
 <div class="card"><h2>Recente transacties</h2><div class="tw"><table><tbody>${S.trades.slice(0,6).map(t=>`<tr><td>${t.t}</td><td>${nm(t.s)} → ${nm(t.b)}</td><td class="n">${t.kW} kW × ${t.h}u</td><td class="n">${pr(t.pr)}</td><td class="n">fee ${eur(t.fee)}</td></tr>`).join('')}</tbody></table></div></div></div>`},
credits(){const tot=C.reduce((a,c)=>a+c.cr,0),sr=[...C].sort((a,b)=>b.cr-a.cr),yes=Object.keys(S.votes).filter(i=>S.votes[i]).reduce((a,i)=>a+C[i].cr,0),no=Object.keys(S.votes).filter(i=>!S.votes[i]).reduce((a,i)=>a+C[i].cr,0),voted=yes+no,mv=S.votes[S.me];
 return head('Credits','Wie capaciteit beschikbaar stelt, bouwt credits op: 1 credit per verhandelde kWh')+
 `<div class="grid2"><div class="card"><h2>Stand van credits</h2><div class="tw"><table><thead><tr><th>#</th><th>Bedrijf</th><th class="n">Credits</th><th>Stemgewicht</th><th class="n">Aandeel</th></tr></thead><tbody>${sr.map((c,i)=>`<tr class="${c.id==S.me?'sel':''}"><td>${i+1}</td><td>${c.n}</td><td class="n">${nf(c.cr)}</td><td><div class="bar"><i style="width:${c.cr/sr[0].cr*100}%;background:var(--green)"></i></div></td><td class="n">${(c.cr/tot*100).toFixed(1).replace('.',',')}%</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h2>Voorrang bij uitbreiding</h2><p class="m">Komt er ruimte op het net, dan krijgen bedrijven in deze volgorde als eerste aanbod.</p><ol style="padding-left:20px;margin:0">${sr.map(c=>`<li>${c.n}</li>`).join('')}</ol></div></div>
 <div class="card" style="margin-top:18px"><h2>Voorstel: Batterij 250 kWh aanschaffen uit de spaarpot (${eur(60000)})</h2>
 <div class="bar" style="height:14px"><i style="width:${yes/(voted||1)*100}%;background:var(--green)"></i></div><p class="m">Voor ${nf(yes)} credits · tegen ${nf(no)} credits · ${Math.round(voted/tot*100)}% van het stemgewicht heeft gestemd</p>
 <div class="row"><span>${C[S.me].n}: ${mv===undefined?'nog niet gestemd':mv?'voor':'tegen'}</span><button id="vy">Stem voor</button><button class="sec" id="vn">Stem tegen</button></div></div>`},
spaarpot(){const mx=Math.max(...S.hist),W=720,H=190,bw=W/S.hist.length;
 const ch=S.hist.map((v,i)=>`<rect x="${i*bw+4}" y="${H-24-v/mx*(H-40)}" width="${bw-8}" height="${v/mx*(H-40)}" fill="${i==S.hist.length-1?'var(--amber)':'var(--blue)'}"/><text x="${i*bw+bw/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--mut)">${i==S.hist.length-1?'nu':'-'+(S.hist.length-1-i)+'d'}</text>`).join('');
 return head('Spaarpot','Transactiekosten van GridMarket, bestemd voor batterijen en elektrolysers')+
 `<div class="kpis"><div class="card kpi"><b>${eur(S.pot)}</b><span>Saldo spaarpot</span></div><div class="card kpi"><b>${eur(S.hist.reduce((a,b)=>a+b,0))}</b><span>Inkomsten laatste 14 dagen</span></div><div class="card kpi"><b>${S.fee*100}%</b><span>Fee per transactie</span></div><div class="card kpi"><b>${S.inv.filter(i=>i.st=='live').length}</b><span>Installaties in bezit</span></div></div>
 <div class="card"><h2>Inkomsten per dag (€)</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fee-inkomsten per dag">${ch}</svg></div>
 <div class="card"><h2>Investeringen</h2><div class="tw"><table><thead><tr><th>Installatie</th><th class="n">Kosten</th><th>Gefinancierd</th><th>Status</th><th></th></tr></thead><tbody>${S.inv.map((i,x)=>{const p=i.st=='live'?100:Math.min(100,S.pot/i.k*100);return`<tr><td>${i.n}<div class="m" style="font-size:12px">${i.d}</div></td><td class="n">${eur(i.k)}</td><td><div class="bar"><i style="width:${p}%;background:var(--green)"></i></div></td><td><span class="tag ${i.st=='live'?'t-a':'t-n'}">${i.st=='live'?'In bedrijf':'Gepland'}</span></td><td>${i.st=='live'?'':`<button data-inv="${x}" ${S.pot<i.k?'disabled':''}>Aanschaffen</button>`}</td></tr>`}).join('')}</tbody></table></div></div>`}};
function route(){const k=(location.hash||'#gridmatch').slice(1);const f=P[k]||P.gridmatch;$('#v').innerHTML=f();
 document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+(P[k]?k:'gridmatch')));bindMe();
 const q=(s,fn)=>document.querySelectorAll(s).forEach(fn);
 if($('#tm'))$('#tm').oninput=e=>{S.now=+e.target.value;route();$('#tm').focus()};
 q('tr.cl',r=>r.onclick=()=>{S.sel=+r.dataset.i;route()});q('[data-r]',b=>b.onclick=()=>{S.rng=b.dataset.r;route()});
 const m=k=='gridmatch'?matches():[];
 q('[data-ex]',b=>b.onclick=()=>{const x=m[b.dataset.ex];trade(x.s,x.b,x.kW,4,x.pr);route()});
 q('[data-pl]',b=>b.onclick=()=>{const x=m[b.dataset.pl];S.orders.push(mk(x.s,x.kW,S.now,S.now+4,x.pr,5));toast('Veiling gestart op GridMarket.');route()});
 q('[data-bid]',b=>b.onclick=()=>{const o=S.orders.find(x=>x.id==b.dataset.bid),v=+$('#q'+o.id).value,tp=hb(o),min=tp?tp.pr+.001:o.pr;if(!(v>=min-1e-9))return toast('Bied minimaal '+pr(min)+' per kWh.');o.bids.push({c:S.me,pr:+v.toFixed(3)});toast('Bod van '+pr(v)+'/kWh geplaatst op '+o.kW+' kW van '+nm(o.c)+'.');route()});
 q('[data-cl]',b=>b.onclick=()=>{fin(S.orders.find(x=>x.id==b.dataset.cl));route()});
 q('[data-rm]',b=>b.onclick=()=>{S.orders=S.orders.filter(x=>x.id!=b.dataset.rm);route()});
 if($('#po'))$('#po').onclick=()=>{const kW=+$('#fk').value,a=+$('#fa').value,b=+$('#fb').value,pr=+$('#fp').value,fr=spare4(C[S.me],S.now);
  if(!(kW>0&&b>a&&pr>0))return toast('Controleer kW, tijdvenster en prijs.');if(kW>fr)return toast(`Je hebt maar ${nf(fr)} kW vrij. De AI blokkeert aanbod boven je prognose.`);
  S.orders.push(mk(S.me,kW,a,b,pr,+$('#fd').value));toast('Veiling gestart.');route()};
 if($('#vy')){$('#vy').onclick=()=>{S.votes[S.me]=1;route()};$('#vn').onclick=()=>{S.votes[S.me]=0;route()}}
 q('[data-inv]',b=>b.onclick=()=>{const i=S.inv[b.dataset.inv];S.pot-=i.k;i.st='live';toast(i.n+' aangeschaft.');route()})}
const mk=(c,kW,a,b,p,min)=>({id:S.oid++,c,kW,a,b,pr:p,end:Date.now()+min*60000,bids:[]});
function fin(o){S.orders=S.orders.filter(x=>x!=o);const w=hb(o);if(!w)return toast('Veiling zonder bod gesloten.');trade(o.c,w.c,o.kW,o.b-o.a,w.pr)}
function tick(){let ch=0;[...S.orders].forEach(o=>{if(o.end<=Date.now()){fin(o);ch=1}});if(ch)route();document.querySelectorAll('.cd').forEach(e=>{const s=Math.max(0,Math.round((e.dataset.end-Date.now())/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')})}
setInterval(tick,1000);addEventListener('hashchange',route);route();tick();
</script></body></html>
